{% extends "base.html" %}
{% block title %}Definir senha — VGS-Torrent{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-kicker">VGS-TORRENT</div>
    <h1>Definir nova senha</h1>
    <p class="subtitle">Olá, <strong>{{ user.username }}</strong>. Sua senha foi redefinida. Crie uma nova senha para continuar.</p>
    <form method="POST" action="{{ url_for('set_password') }}" class="form">
      <label for="password">Nova senha</label>
      <input class="form-input" type="password" id="password" name="password" required minlength="6" autofocus>
      <label for="confirm_password">Confirmar nova senha</label>
      <input class="form-input" type="password" id="confirm_password" name="confirm_password" required minlength="6">
      <button type="submit" class="save-btn auth-submit">SALVAR SENHA</button>
    </form>
  </div>
</div>
{% endblock %}
